version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: pathpilot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pathpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: pathpilot_app
    restart: always
    depends_on:
      - db
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/pathpilot_db
      # Add other API key configuration keys here if needed
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./outputs:/app/outputs

volumes:
  postgres_data:
